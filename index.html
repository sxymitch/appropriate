<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jigsaw Puzzle</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        padding: 30px;
        font-family: Arial, sans-serif;
        text-align: center;
        background: linear-gradient(135deg, #fff3e0, #ffffff);
        color: #17324d;
    }

    h1 {
        font-size: 38px;
        margin-bottom: 5px;
    }

    p {
        font-size: 18px;
    }

    #board {
        display: flex;
        justify-content: center;
        flex-wrap: wrap;
        gap: 6px;
        max-width: 950px;
        min-height: 110px;
        margin: 30px auto;
        padding: 15px;

        border: 4px dashed #78909c;
        border-radius: 15px;
        background: #f5f5f5;
    }

    .slot {
        width: 65px;
        height: 75px;
        border: 3px dashed #b0bec5;
        border-radius: 10px;
        background: white;
    }

    #pieces {
        display: flex;
        justify-content: center;
        flex-wrap: wrap;
        gap: 10px;
        max-width: 900px;
        margin: 20px auto;
    }

    .piece {
        width: 65px;
        height: 75px;

        display: flex;
        justify-content: center;
        align-items: center;

        background: #ff9800;
        color: white;

        font-size: 32px;
        font-weight: bold;

        border-radius: 12px;
        cursor: grab;

        box-shadow: 0 4px 8px rgba(0,0,0,0.2);

        user-select: none;
    }

    .piece:hover {
        transform: scale(1.05);
    }

    .correct {
        background: #4caf50;
        cursor: default;
    }

    #message {
        min-height: 40px;
        margin: 15px;
        font-size: 24px;
        font-weight: bold;
        color: #16803c;
    }

    button {
        padding: 12px 25px;
        border: none;
        border-radius: 8px;
        background: #17324d;
        color: white;
        font-size: 16px;
        cursor: pointer;
    }

    button:hover {
        background: #285a80;
    }
</style>
</head>

<body>

<h1>jigsaw</h1>

<p>
    Drag the letters into the correct order to complete the word.
</p>

<div id="board"></div>

<div id="pieces"></div>

<div id="message"></div>

<button onclick="resetPuzzle()">🔄 Reset Puzzle</button>

<script>

const word = "APPROPRIATE";

/* Scrambled letters */
const scrambled = [
    "R", "A", "T", "P", "I",
    "E", "O", "P", "A", "R", "P"
];

const board = document.getElementById("board");
const piecesContainer = document.getElementById("pieces");
const message = document.getElementById("message");

let draggedPiece = null;


/* Create puzzle spaces */

function createBoard() {

    board.innerHTML = "";

    for (let i = 0; i < word.length; i++) {

        const slot = document.createElement("div");

        slot.className = "slot";

        slot.dataset.position = i;

        slot.addEventListener("dragover", function(e) {
            e.preventDefault();
        });

        slot.addEventListener("drop", function() {

            if (!draggedPiece) return;

            const correctLetter = word[this.dataset.position];
            const selectedLetter = draggedPiece.dataset.letter;

            if (correctLetter === selectedLetter) {

                this.appendChild(draggedPiece);

                draggedPiece.classList.add("correct");

                draggedPiece.draggable = false;

                draggedPiece = null;

                checkComplete();

            } else {

                message.textContent =
                    "❌ Not quite! Try another position.";

                setTimeout(() => {
                    message.textContent = "";
                }, 1200);
            }
        });

        board.appendChild(slot);
    }
}


/* Create letter pieces */

function createPieces() {

    piecesContainer.innerHTML = "";

    scrambled.forEach(letter => {

        const piece = document.createElement("div");

        piece.className = "piece";

        piece.textContent = letter;

        piece.dataset.letter = letter;

        piece.draggable = true;

        piece.addEventListener("dragstart", function() {
            draggedPiece = this;
        });

        piecesContainer.appendChild(piece);
    });
}


/* Check if the puzzle is complete */

function checkComplete() {

    const slots = document.querySelectorAll(".slot");

    const complete = Array.from(slots).every(slot => {
        return slot.children.length === 1;
    });

    if (complete) {

        message.textContent =
            "🎉 Excellent! You spelled APPROPRIATE!";

    }
}


/* Reset puzzle */

function resetPuzzle() {

    message.textContent = "";

    draggedPiece = null;

    createBoard();

    createPieces();
}


/* Start the game */

createBoard();
createPieces();

</script>

</body>
</html>
